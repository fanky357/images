name: node_20.12.1
on:
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/node_20.12.1.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v2

      - name: Login in AliYun Registry
        uses: docker/login-action@v1
        with:
          registry: registry-intl.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUNHUB_USERNAME }}
          password: ${{ secrets.ALIYUNHUB_TOKEN }}

      - name: Build and push
        run: |
          docker pull docker.1ms.run/library/node:20.12.1
          docker tag docker.1ms.run/library/node:20.12.1 registry-intl.cn-hangzhou.aliyuncs.com/fky357/node:20.12.1-amd64
          docker push registry-intl.cn-hangzhou.aliyuncs.com/fky357/node:20.12.1-amd64
