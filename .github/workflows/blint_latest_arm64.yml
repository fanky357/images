name: blint_latest_arm64
on:
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/blint_latest_arm64.yml'

jobs:
  sync-arm64:
    runs-on: ubuntu-latest

    env:
      SOURCE_IMAGE: ghcr.io/owasp-dep-scan/blint:latest
      TARGET_IMAGE: registry-intl.cn-hangzhou.aliyuncs.com/fky357/blint:latest-arm64

    steps:
      - name: Login to Aliyun Registry
        uses: docker/login-action@v4
        with:
          registry: registry-intl.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUNHUB_USERNAME }}
          password: ${{ secrets.ALIYUNHUB_TOKEN }}

      - name: Pull and push ARM64 image
        shell: bash
        run: |
          set -euo pipefail

          docker pull --platform linux/arm64 "$SOURCE_IMAGE"

          # 明确检查 ARM64 平台，并通过 JSON 读取架构
          docker image inspect \
            --platform linux/arm64 \
            "$SOURCE_IMAGE" > image-inspect.json

          architecture="$(jq -r '.[0].Architecture // empty' image-inspect.json)"

          echo "Image architecture: $architecture"

          if [ "$architecture" != "arm64" ]; then
            echo "ERROR: Expected arm64, got '$architecture'" >&2
            cat image-inspect.json
            exit 1
          fi

          docker tag "$SOURCE_IMAGE" "$TARGET_IMAGE"
          docker push "$TARGET_IMAGE"
